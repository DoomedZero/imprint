<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMPRINT</title>
    <link rel="stylesheet" href="src/css/styles.css">
</head>

<body>
    <main>
        <div class="print-photo" id="door">
            <img src="src/img/door.jpg" alt="">
        </div>
    </main>


    <section id="dialogue" class="dialogue hidden" aria-live="polite">
        <div class="dialogue-header">
            <span id="dialogue-title"></span>
            <button id="close-dialogue" aria-label="Close dialogue">×</button>
        </div>

        <p id="dialogue-text"></p>

        <div id="dialogue-choices"></div>
    </section>



    <script type="module" src="src/js/render.js"></script>
</body>

</html>
