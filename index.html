<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMPRINT</title>
    <link rel="icon" href="favicon.svg">
    <link rel="stylesheet" href="src/css/styles.css">
    <link rel="stylesheet" href="src/css/archive.css">
    <link rel="stylesheet" href="src/css/info.css">
</head>

<body>

    <section id="welcome-screen">
        <div>
            <h1>??</h1>
            <p>You wonder how to play this game :</p>
            <p>1. Read dialogues carefully</p>
            <p>2. Observe changes in words</p>
            <p>3. If you are stuck you can Restart</p>
            <p>4. Guide in github README.md</p>
            <p>5. Any other feedback, DM on Slack</p>

            <button id="play-button">Play Now</button>

        </div>

    </section>


    <main id="app"></main>


    <section id="dialogue" class="dialogue hidden" aria-live="polite">
        <div class="dialogue-header">
            <span id="dialogue-title"></span>
        </div>

        <p id="dialogue-text"></p>

        <div id="dialogue-choices"></div>
    </section>


    <audio id="bgm" loop preload="auto">
        <source src="src/music/moonlight-sonata.mp3" type="audio/mpeg">
    </audio>


    <script type="module" src="src/js/main.js"></script>
</body>

</html>
