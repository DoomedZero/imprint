<!DOCTYPE html>
<html lang="en">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMPRINT</title>
    <link rel="stylesheet" href="src/css/styles.css">
    <link rel="stylesheet" href="src/css/archive.css">
    <link rel="stylesheet" href="src/css/two-doors.css">

<body>

    <section id="dialogue" class="dialogue hidden" aria-live="polite">

        <p id="dialogue-text"></p>

        <div id="dialogue-choices"></div>
    </section>

    <audio id="bgm" loop preload="auto">
        <source src="src/music/moonlight-sonata.mp3" type="audio/mpeg">
    </audio>

    <script type="module" src="src/js/music.js"></script>

    <script type="module" src="src/js/render.js"></script>
